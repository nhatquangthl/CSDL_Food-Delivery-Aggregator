<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Food Delivery Mini</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <nav class="bg-blue-800 p-4 text-white flex justify-between items-center shadow-lg">
        <a href="/" class="font-bold text-xl flex items-center gap-2">🍔 Mini-DoorDash</a>
        
        <!-- MODULE ĐỔI TÀI KHOẢN -->
        <form action="/switch_user" method="POST" class="flex items-center gap-2">
            <span class="text-sm text-blue-200">Đang đóng vai:</span>
            <select name="user_type" id="user_type" class="text-black p-1 rounded text-sm" onchange="document.getElementById('user_id').selectedIndex = this.selectedIndex">
                <option value="ADMIN" {% if current_user_type == 'ADMIN' %}selected{% endif %}>ADMIN HỆ THỐNG</option>
                {% for u in all_users %}
                    <option value="{{ u.user_type }}" {% if current_user_id == u.user_id %}selected{% endif %}>{{ u.user_type }}</option>
                {% endfor %}
            </select>
            <select name="user_id" id="user_id" class="text-black p-1 rounded text-sm">
                <option value="ADMIN" {% if current_user_id == 'ADMIN' %}selected{% endif %}>Toàn quyền (Admin)</option>
                {% for u in all_users %}
                    <option value="{{ u.user_id }}" {% if current_user_id == u.user_id %}selected{% endif %}>{{ u.user_id }} - {{ u.full_name }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="bg-green-500 hover:bg-green-600 px-3 py-1 rounded text-sm font-bold shadow">Chuyển</button>
        </form>
    </nav>

    <div class="max-w-6xl mx-auto p-6">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 mb-4 rounded text-white {{ 'bg-green-500' if category == 'success' else 'bg-red-500' }} shadow">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
